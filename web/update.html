<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>预览更新</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:28px 24px;color:light-dark(#172032,#eee);background:light-dark(#fff,#171322);font-size:14px;line-height:1.6}h1{font-size:21px;margin:0 60px 6px 0}h2{font-size:15px}p{margin:8px 0 16px;color:light-dark(#596475,#c4bfd0)}section{margin:20px 0;padding-top:16px;border-top:1px solid #8885}label{display:block;font-weight:600;margin:12px 0 6px}input,button{font:inherit;min-height:42px;border:1px solid #8886;border-radius:7px;padding:8px 12px}input{width:100%;background:transparent;color:inherit}button{cursor:pointer;background:#8661d5;color:white;margin:10px 8px 0 0}button.secondary{background:transparent;color:inherit}button:disabled{opacity:.5;cursor:default}#message{white-space:pre-wrap;padding:12px;border-radius:7px;background:#8881;min-height:48px}#message[data-error=true]{color:light-dark(#b91c1c,#ffb3b3)}#notes{padding-left:20px}small{color:light-dark(#596475,#c4bfd0)}progress{width:100%;height:10px}code{word-break:break-all}#ready{color:light-dark(#087f55,#7ae6b0)}
#remote{max-height:150px;overflow:auto;margin-top:10px;padding:8px;background:#8881;border-radius:7px}</style><h1>预览更新</h1><p>更新本项目的界面与部署工具，保留官方程序及业务数据。</p>
<div id="version" aria-live="polite">正在读取版本…</div>
<section><h2>1. 选择更新包</h2><p>从公开仓库检查并下载签名更新包，无需 GitHub Token。也支持手动导入 ZIP。</p><a href="https://github.com/zxyszx/subnest-x-preview/releases" target="_blank" rel="noopener noreferrer">打开本项目发布页</a>
<div><button id="latest" class="secondary">检查新版本</button><button id="download" disabled>下载并检查</button></div><div id="remote"></div><label for="key">维护口令</label><input id="key" type="password" autocomplete="off" placeholder="服务器 runtime/update-key 文件中的口令"><small>不是 GitHub Token，也不是登录密码。口令只保留在当前页面内存。</small>
<label for="file">签名更新包（ZIP）</label><input id="file" type="file" accept=".zip"><button id="inspect">检查更新包</button>
<div id="package"></div><ul id="notes"></ul></section>
<section><h2>2. 安装与重启</h2><p>校验通过后备份代码及 SQLite 数据，再替换本项目文件。只有服务恢复并返回目标版本，才显示更新成功。</p><button id="apply" disabled>安装更新</button><button id="restart" disabled>立即重启</button><button id="recheck" class="secondary">重新检查</button></section>
<div id="message" role="status" aria-live="polite">请检查新版本，或选择已下载的更新包。</div><progress id="progress" hidden></progress>
<script>
const $ = id => document.getElementById(id); let verifiedFile=null,target=null,busy=false,remoteAvailable=false;
const message=(text,error=false)=>{ $('message').textContent=text;$('message').dataset.error=error; };
const request=async(route,body)=>{const response=await fetch('/__preview/'+route,{method:'POST',headers:{Authorization:'Bearer '+$('key').value},body});const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');return result;};
async function state(){const response=await fetch('/__preview/version',{cache:'no-store'});if(!response.ok)throw Error('无法读取服务状态');const v=await response.json();$('version').textContent='预览运行版本 v'+v.running+' · 官方程序 v'+v.upstream+(v.pending?' · 有更新等待重启':'');$('restart').disabled=!v.pending||busy;return v;}
function lock(on){busy=on;for(const id of ['inspect','file','key','recheck','latest'])$(id).disabled=on;$('download').disabled=on||!remoteAvailable;$('apply').disabled=on||!verifiedFile;$('restart').disabled=on;$('progress').hidden=!on;}
$('file').onchange=()=>{verifiedFile=null;target=null;$('apply').disabled=true;$('package').textContent='';$('notes').replaceChildren();};
$('inspect').onclick=async()=>{try{const file=$('file').files[0];if(!file)throw Error('请先选择 ZIP 更新包');if(!$('key').value)throw Error('请输入维护口令');lock(true);message('正在校验项目、签名、版本和文件…');const info=await request('inspect',file);verifiedFile=file;target=info.version;$('package').textContent='签名校验通过 · 目标版本 v'+target;$('notes').replaceChildren();for(const text of info.notes){const item=document.createElement('li');item.textContent=text;$('notes').append(item);}message('检查通过，请核对更新内容，再点击安装更新。');}catch(error){verifiedFile=null;message(error.message,true);}finally{lock(false);await state().catch(()=>{});}};
$('apply').onclick=async()=>{if(!verifiedFile)return;try{lock(true);message('正在备份并安装更新，请勿重复操作…');const info=await request('apply',verifiedFile);verifiedFile=null;message(info.message);}catch(error){message(error.message,true);}finally{lock(false);await state().catch(()=>{});}};
$('restart').onclick=async()=>{try{lock(true);const before=await state();target=before.installed;await request('restart');message('正在重启并等待服务恢复…');const deadline=Date.now()+90000;let ok=false;while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,1500));try{const after=await state();if(after.running===target&&!after.pending){ok=true;break;}}catch{}}if(!ok)throw Error('90 秒内未确认目标版本恢复。请查看服务器日志；当前不能标记更新成功。');message('更新成功：服务已恢复，当前运行 v'+target+'。');}catch(error){message(error.message,true);}finally{lock(false);await state().catch(()=>{});}};
$('latest').onclick=async()=>{try{lock(true);message('正在检查公开仓库…');const response=await fetch('/__preview/latest',{cache:'no-store'});const info=await response.json();if(!response.ok)throw Error(info.error);const current=await state();const parts=v=>v.split('.').map(Number);const a=parts(info.version),b=parts(current.installed);remoteAvailable=false;for(let i=0;i<3;i++){if(a[i]!==b[i]){remoteAvailable=a[i]>b[i];break;}}$('remote').textContent='最新发布 v'+info.version+'\n'+info.notes;$('remote').style.whiteSpace='pre-wrap';message(remoteAvailable?'发现新版本，可下载并检查签名。':current.pending?'更新已安装，请重启完成更新。':'当前已是最新发布版本。');}catch(error){remoteAvailable=false;message(error.message,true);}finally{lock(false);await state().catch(()=>{});}};
$('download').onclick=async()=>{try{if(!$('key').value)throw Error('请输入维护口令');lock(true);message('正在下载并校验签名…');const response=await fetch('/__preview/download',{method:'POST',headers:{Authorization:'Bearer '+$('key').value}});if(!response.ok){const error=await response.json();throw Error(error.error);}const blob=await response.blob();const info=await request('inspect',blob);verifiedFile=blob;target=info.version;$('package').textContent='签名校验通过 · 目标版本 v'+target;$('notes').replaceChildren();for(const text of info.notes){const li=document.createElement('li');li.textContent=text;$('notes').append(li);}message('下载和检查通过，请核对更新内容，再点击安装更新。');}catch(error){verifiedFile=null;message(error.message,true);}finally{lock(false);await state().catch(()=>{});}};
$('recheck').onclick=()=>state().then(()=>message('已重新读取运行版本。点击“检查新版本”查询公开发布。')).catch(error=>message(error.message,true));
state().catch(error=>message(error.message,true));
</script></html>
