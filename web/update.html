<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>检查更新</title>
<style>
:root{font-family:var(--font-sans,system-ui);background:var(--popover,#211a2d);color:var(--foreground,#e9e3fb)}*{box-sizing:border-box}html,body{min-height:0!important;height:auto!important}body{margin:0;padding:24px;background:var(--popover,#211a2d);color:var(--foreground,#e9e3fb);font-size:14px;line-height:1.5}h1{font-size:18px;margin:0 32px 6px 0;font-weight:600;display:flex;align-items:center;gap:8px}h1 svg{width:20px;height:20px}h2{font-size:14px;margin:0 0 8px}p{margin:0 0 18px;color:var(--muted-foreground,#c2b7d5)}label{display:block;font-weight:500;margin:12px 0 6px}input,button{font:inherit;min-height:36px;border:1px solid var(--border,#82739a);border-radius:8px;padding:7px 12px}input{width:100%;background:var(--background,#181321);color:inherit}button{cursor:pointer;background:var(--primary,#a78bfa);color:var(--primary-foreground,#191022);border-color:transparent;font-weight:500}button.secondary{background:var(--secondary,#2b233b);color:inherit;border-color:var(--border,#82739a)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--primary,#a78bfa);outline-offset:2px}.channel{display:flex;gap:8px}.channel button{flex:1}.channel button[aria-pressed=true]{background:var(--primary,#a78bfa);color:var(--primary-foreground,#191022)}#hero{display:flex;min-height:170px;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}#status-icon{color:#00c96b;width:44px;height:44px}#message{font-size:18px;font-weight:600;white-space:pre-wrap}#message[data-error=true]{font-size:14px;color:var(--destructive,#ffadbd)}#version{color:var(--muted-foreground,#c2b7d5);font-size:14px}#remote:empty,#package:empty,#notes:empty{display:none}#remote{max-height:150px;overflow:auto;white-space:pre-wrap;margin:12px 0;color:var(--muted-foreground,#c2b7d5)}#notes{padding-left:20px;max-height:140px;overflow:auto}#latest{width:100%;margin-top:16px}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions:has(button:not([hidden])){margin:12px 0}details{margin-top:16px;border-top:1px solid var(--border,#82739a);padding-top:12px}summary{cursor:pointer;color:var(--muted-foreground,#c2b7d5)}small{display:block;color:var(--muted-foreground,#aaa0bd);margin:6px 0 12px}progress{width:100%;height:8px;accent-color:var(--primary,#a78bfa)}[hidden]{display:none!important}#recheck{margin-top:12px}
</style>
<h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg>检查更新</h1><p>检查是否有新版本可用</p>
<h2>更新通道</h2><div class="channel"><button id="stable" aria-pressed="true">稳定版</button><button id="preview" class="secondary" disabled title="本项目暂未发布预发布版">预发布版</button></div>
<div id="hero"><span id="status-icon" hidden><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11v1a9 9 0 1 1-5-8"/><path d="m9 11 3 3L22 4"/></svg></span><div id="message" role="status" aria-live="polite">正在检查更新…</div><div id="version">正在读取版本…</div></div><progress id="progress" hidden></progress>
<div id="remote" hidden></div><button id="release-notes" class="secondary" hidden>查看更新内容</button>
<div class="actions"><button id="download" hidden disabled>下载更新</button><button id="apply" hidden disabled>安装更新</button><button id="restart" hidden disabled>立即重启</button></div>
<div id="package"></div><ul id="notes"></ul><button id="latest" class="secondary">重新检查</button>
<details id="advanced"><summary>手动导入与维护选项</summary><label for="key">维护口令</label><input id="key" type="password" autocomplete="off" placeholder="请输入服务器维护口令"><small>在线安装和手动导入均需要维护口令，仅保留在当前页面内存中。</small><label for="file">签名更新包（ZIP）</label><input id="file" type="file" accept=".zip"><button id="inspect">检查更新包</button><button id="recheck" class="secondary">重新检查状态</button></details>
<script>
const $ = id => document.getElementById(id); let verifiedFile=null,target=null,busy=false,remoteAvailable=false;
const message=(text,error=false)=>{ $('message').textContent=text;$('message').dataset.error=error;if(error)$('status-icon').hidden=true; };
const request=async(route,body)=>{const response=await fetch('/__preview/'+route,{method:'POST',headers:{Authorization:'Bearer '+$('key').value},body});const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');return result;};
async function state(){const response=await fetch('/__preview/version',{cache:'no-store'});if(!response.ok)throw Error('无法读取服务状态');const v=await response.json();$('version').textContent='当前版本 v'+v.running+(v.pending?' · 有更新等待重启':'');$('restart').disabled=!v.pending||busy;$('restart').hidden=!v.pending;return v;}
function lock(on){busy=on;for(const id of ['inspect','file','key','recheck','latest','stable'])$(id).disabled=on;$('download').disabled=on||!remoteAvailable;$('apply').disabled=on||!verifiedFile;$('apply').hidden=!verifiedFile;$('restart').disabled=on;$('progress').hidden=!on;}
$('file').onchange=()=>{verifiedFile=null;target=null;$('apply').disabled=true;$('package').textContent='';$('notes').replaceChildren();};
async function checkLatest(){try{lock(true);message('正在检查公开仓库…');const response=await fetch('/__preview/latest',{cache:'no-store'});const info=await response.json();if(!response.ok)throw Error(info.error);const current=await state();const parts=v=>v.split('.').map(Number);const a=parts(info.version),b=parts(current.running);remoteAvailable=false;for(let i=0;i<3;i++){if(a[i]!==b[i]){remoteAvailable=a[i]>b[i];break;}}$('remote').textContent='最新发布 v'+info.version+'\n'+info.notes;$('release-notes').hidden=!info.notes;$('download').hidden=!remoteAvailable;$('status-icon').hidden=remoteAvailable;message(remoteAvailable?'发现新版本，可下载并检查签名。':'已是最新版本');}catch(error){remoteAvailable=false;message(error.message,true);}finally{lock(false);await state().catch(()=>{});}}
$('latest').onclick=checkLatest;$('stable').onclick=checkLatest;$('preview').onclick=null;
$('download').onclick=async()=>{try{if(!$('key').value){$('advanced').open=true;$('key').focus();throw Error('请输入维护口令');}lock(true);message('正在下载并校验签名…');const response=await fetch('/__preview/download',{method:'POST',headers:{Authorization:'Bearer '+$('key').value}});if(!response.ok){const error=await response.json();throw Error(error.error);}const blob=await response.blob();const info=await request('inspect',blob);verifiedFile=blob;target=info.version;$('package').textContent='签名校验通过 · 目标版本 v'+target;$('notes').replaceChildren();for(const text of info.notes){const li=document.createElement('li');li.textContent=text;$('notes').append(li);}message('下载和检查通过，请核对更新内容，再点击安装更新。');}catch(error){verifiedFile=null;message(error.message,true);}finally{lock(false);await state().catch(()=>{});}};
$('inspect').onclick=async()=>{try{const file=$('file').files[0];if(!file)throw Error('请先选择 ZIP 更新包');if(!$('key').value){$('advanced').open=true;$('key').focus();throw Error('请输入维护口令');}lock(true);message('正在校验项目、签名、版本和文件…');const info=await request('inspect',file);verifiedFile=file;target=info.version;$('package').textContent='签名校验通过 · 目标版本 v'+target;$('notes').replaceChildren();for(const text of info.notes){const item=document.createElement('li');item.textContent=text;$('notes').append(item);}message('检查通过，请核对更新内容，再点击安装更新。');}catch(error){verifiedFile=null;message(error.message,true);}finally{lock(false);await state().catch(()=>{});}};
$('apply').onclick=async()=>{if(!verifiedFile)return;try{lock(true);message('正在备份并安装更新，请勿重复操作…');const info=await request('apply',verifiedFile);verifiedFile=null;message(info.message);}catch(error){message(error.message,true);}finally{lock(false);await state().catch(()=>{});}};
$('restart').onclick=async()=>{try{lock(true);const before=await state();target=before.installed;await request('restart');message('正在重启并等待服务恢复…');const deadline=Date.now()+90000;let ok=false;while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,1500));try{const after=await state();if(after.running===target&&!after.pending){ok=true;break;}}catch{}}if(!ok)throw Error('90 秒内未确认目标版本恢复。请查看服务器日志；当前不能标记更新成功。');message('更新成功：服务已恢复，当前运行 v'+target+'。');}catch(error){message(error.message,true);}finally{lock(false);await state().catch(()=>{});}};
$('release-notes').onclick=()=>{$('remote').hidden=!$('remote').hidden;};$('recheck').onclick=()=>state().then(()=>message('已重新读取运行版本。')).catch(error=>message(error.message,true));checkLatest();
</script></html>
