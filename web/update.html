<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>检查更新</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#211a2d;color:#f4efff}*{box-sizing:border-box}body{margin:0;padding:26px 24px;background:#211a2d;color:#f4efff;font-size:14px;line-height:1.55}h1{font-size:20px;margin:0 58px 4px 0;font-weight:700}h1::before{content:'⟳';font-size:22px;margin-right:9px}h2{font-size:15px;margin:0 0 12px}p{margin:7px 0 15px;color:#c2b7d5}section{margin:20px 0;padding-top:16px;border-top:1px solid #82739a}label{display:block;font-weight:600;margin:12px 0 6px}input,button{font:inherit;min-height:40px;border:1px solid #82739a;border-radius:7px;padding:7px 12px}input{width:100%;background:#181321;color:#f4efff}button{cursor:pointer;background:#a77bf2;color:#191022;border-color:#a77bf2;font-weight:600;margin:8px 8px 0 0}button.secondary{background:#2b233b;color:#eee7ff;border-color:#82739a}button:disabled{opacity:.42;cursor:default}#message{white-space:pre-wrap;padding:11px;border-radius:7px;background:#302541;min-height:44px;color:#eee7ff}#message[data-error=true]{color:#ffadbd}#notes{padding-left:20px;color:#ddd0ee;max-height:145px;overflow:auto;margin:9px 0}#remote{max-height:145px;overflow:auto;margin-top:10px;padding:8px;background:#302541;border-radius:7px;color:#ddd0ee}small{color:#aaa0bd}progress{width:100%;height:9px;accent-color:#a77bf2}code{word-break:break-all}#ready{color:#64e0a7}.version{font-weight:600;color:#eee7ff;margin:18px 0;border-bottom:1px solid #82739a;padding-bottom:17px}.channel{display:flex;gap:8px}.channel button{flex:1}
</style><h1>检查更新</h1><p>检查本项目是否有新版本可用。</p>
<div id="version" class="version" aria-live="polite">正在读取版本…</div>
<section><h2>更新通道</h2><div class="channel"><button id="stable" class="secondary">稳定版</button><button id="preview" class="secondary">预发布版</button></div><div id="remote"></div><div><button id="latest" class="secondary">重新检查</button><button id="download" disabled>下载并检查</button></div>
<p>公开仓库的签名更新包无需 GitHub Token，也可以手动导入 ZIP。</p><label for="key">维护口令</label><input id="key" type="password" autocomplete="off" placeholder="服务器 runtime/update-key 文件中的口令"><small>不是 GitHub Token，也不是登录密码。口令只保留在当前页面内存。</small>
<label for="file">签名更新包（ZIP）</label><input id="file" type="file" accept=".zip"><button id="inspect">检查更新包</button><div id="package"></div><ul id="notes"></ul></section>
<section><h2>安装与重启</h2><p>校验通过后会先备份代码和 SQLite 数据，再替换项目文件。重启后确认目标版本实际运行。</p><button id="apply" disabled>安装更新</button><button id="restart" disabled>立即重启</button><button id="recheck" class="secondary">重新检查状态</button></section>
<div id="message" role="status" aria-live="polite">请选择更新通道，或导入签名更新包。</div><progress id="progress" hidden></progress>
<script>
const $ = id => document.getElementById(id); let verifiedFile=null,target=null,busy=false,remoteAvailable=false;
const message=(text,error=false)=>{ $('message').textContent=text;$('message').dataset.error=error; };
const request=async(route,body)=>{const response=await fetch('/__preview/'+route,{method:'POST',headers:{Authorization:'Bearer '+$('key').value},body});const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');return result;};
async function state(){const response=await fetch('/__preview/version',{cache:'no-store'});if(!response.ok)throw Error('无法读取服务状态');const v=await response.json();$('version').textContent='当前版本 v'+v.running+(v.pending?' · 有更新等待重启':'');$('restart').disabled=!v.pending||busy;return v;}
function lock(on){busy=on;for(const id of ['inspect','file','key','recheck','latest','stable','preview'])$(id).disabled=on;$('download').disabled=on||!remoteAvailable;$('apply').disabled=on||!verifiedFile;$('restart').disabled=on;$('progress').hidden=!on;}
$('file').onchange=()=>{verifiedFile=null;target=null;$('apply').disabled=true;$('package').textContent='';$('notes').replaceChildren();};
async function checkLatest(){try{lock(true);message('正在检查公开仓库…');const response=await fetch('/__preview/latest',{cache:'no-store'});const info=await response.json();if(!response.ok)throw Error(info.error);const current=await state();const parts=v=>v.split('.').map(Number);const a=parts(info.version),b=parts(current.running);remoteAvailable=false;for(let i=0;i<3;i++){if(a[i]!==b[i]){remoteAvailable=a[i]>b[i];break;}}$('remote').textContent='最新发布 v'+info.version+'\n'+info.notes;message(remoteAvailable?'发现新版本，可下载并检查签名。':'当前已是最新版本。');}catch(error){remoteAvailable=false;message(error.message,true);}finally{lock(false);await state().catch(()=>{});}}
$('latest').onclick=checkLatest;$('stable').onclick=checkLatest;$('preview').onclick=checkLatest;
$('download').onclick=async()=>{try{if(!$('key').value)throw Error('请输入维护口令');lock(true);message('正在下载并校验签名…');const response=await fetch('/__preview/download',{method:'POST',headers:{Authorization:'Bearer '+$('key').value}});if(!response.ok){const error=await response.json();throw Error(error.error);}const blob=await response.blob();const info=await request('inspect',blob);verifiedFile=blob;target=info.version;$('package').textContent='签名校验通过 · 目标版本 v'+target;$('notes').replaceChildren();for(const text of info.notes){const li=document.createElement('li');li.textContent=text;$('notes').append(li);}message('下载和检查通过，请核对更新内容，再点击安装更新。');}catch(error){verifiedFile=null;message(error.message,true);}finally{lock(false);await state().catch(()=>{});}};
$('inspect').onclick=async()=>{try{const file=$('file').files[0];if(!file)throw Error('请先选择 ZIP 更新包');if(!$('key').value)throw Error('请输入维护口令');lock(true);message('正在校验项目、签名、版本和文件…');const info=await request('inspect',file);verifiedFile=file;target=info.version;$('package').textContent='签名校验通过 · 目标版本 v'+target;$('notes').replaceChildren();for(const text of info.notes){const item=document.createElement('li');item.textContent=text;$('notes').append(item);}message('检查通过，请核对更新内容，再点击安装更新。');}catch(error){verifiedFile=null;message(error.message,true);}finally{lock(false);await state().catch(()=>{});}};
$('apply').onclick=async()=>{if(!verifiedFile)return;try{lock(true);message('正在备份并安装更新，请勿重复操作…');const info=await request('apply',verifiedFile);verifiedFile=null;message(info.message);}catch(error){message(error.message,true);}finally{lock(false);await state().catch(()=>{});}};
$('restart').onclick=async()=>{try{lock(true);const before=await state();target=before.installed;await request('restart');message('正在重启并等待服务恢复…');const deadline=Date.now()+90000;let ok=false;while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,1500));try{const after=await state();if(after.running===target&&!after.pending){ok=true;break;}}catch{}}if(!ok)throw Error('90 秒内未确认目标版本恢复。请查看服务器日志；当前不能标记更新成功。');message('更新成功：服务已恢复，当前运行 v'+target+'。');}catch(error){message(error.message,true);}finally{lock(false);await state().catch(()=>{});}};
$('recheck').onclick=()=>state().then(()=>message('已重新读取运行版本。')).catch(error=>message(error.message,true));state().catch(error=>message(error.message,true));
</script></html>
